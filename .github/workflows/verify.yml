name: Reproduce banking benchmark
on:
  push:
    paths: ['**.py', 'requirements.txt', '.github/workflows/verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python download_data.py
      - run: python run.py
      - run: python -m unittest discover -s tests -v
